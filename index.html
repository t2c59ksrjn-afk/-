<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>30秒专注力挑战</title>
    <style>
        /* 全局样式 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* 米灰色和绿色渐变背景 */
            background: linear-gradient(135deg, #E8E8E8 0%, #C8D6C1 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 启动页和游戏页的通用容器 */
        .container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 启动页样式 */
        #start-screen {
            text-align: center;
        }
        #start-screen h1 {
            font-size: 2rem;
            color: #4A5D4E;
            margin-bottom: 10px;
        }
        #start-screen p {
            color: #666;
            margin-bottom: 40px;
            line-height: 1.5;
        }
        .btn {
            width: 200px;
            padding: 15px 0;
            font-size: 1.2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
            font-weight: bold;
        }
        .btn-start {
            background-color: #6B8E78;
            color: white;
            box-shadow: 0 4px 15px rgba(107, 142, 120, 0.4);
        }
        .btn-start:active {
            transform: scale(0.95);
        }
        .btn-exit {
            background-color: transparent;
            color: #888;
            font-size: 1rem;
            box-shadow: none;
        }

        /* 游戏页样式 */
        #game-screen {
            display: none; /* 默认隐藏 */
        }
        
        /* 顶部信息栏 */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .current-target {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4A5D4E;
        }
        /* 右上角倒计时 */
        .timer-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4A5D4E;
            background: rgba(255, 255, 255, 0.5);
            padding: 5px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
        .timer-warning {
            color: #e74c3c !important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 网格区域：5列 x 6行 = 30个 */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
        }
        .cell {
            background-color: rgba(255, 255, 255, 0.8);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: #555;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.1s;
        }
        .cell:active {
            transform: scale(0.9);
        }
        .cell.clicked {
            background-color: rgba(255, 255, 255, 0.3);
            color: transparent; /* 点过的数字隐藏，增加难度和成就感 */
            box-shadow: none;
        }

        /* 结果弹窗 */
        #result-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(232, 232, 232, 0.95);
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
        }
        #result-overlay h2 {
            font-size: 2rem;
            color: #4A5D4E;
        }
    </style>
</head>
<body>

    <!-- 启动页 -->
    <div class="container" id="start-screen">
        <h1>30秒专注力挑战</h1>
        <p>规则：按顺序点击 1 到 30 的数字。<br>测试你的视觉专注力和反应速度。</p>
        <button class="btn btn-start" onclick="startGame()">开始挑战</button>
        <button class="btn btn-exit" onclick="exitGame()">退出</button>
    </div>

    <!-- 游戏页 -->
    <div class="container" id="game-screen">
        <div class="top-bar">
            <div class="current-target" id="target-display">找: 1</div>
            <!-- 右上角倒计时 -->
            <div class="timer-box" id="timer-display">30.0s</div>
        </div>
        <div class="grid" id="grid-container"></div>

        <!-- 结果弹窗 -->
        <div id="result-overlay">
            <h2 id="result-title">挑战成功！</h2>
            <p id="result-desc" style="margin-bottom: 30px; color:#666;"></p>
            <button class="btn btn-start" onclick="startGame()">再来一次</button>
            <button class="btn btn-exit" onclick="backToHome()">返回首页</button>
        </div>
    </div>

    <script>
        // 全局变量
        let currentNumber = 1;
        let timeLeft = 30.0;
        let timerInterval = null;
        let isPlaying = false;
        let audioCtx = null;
        let tickInterval = null;

        // 初始化音频上下文（必须由用户交互触发）
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 播放滴答音效
        function playTickSound() {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine'; // 类似机械表的声音
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime); // 高频
            
            // 音量渐弱（点击声）
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // 退出逻辑
        function exitGame() {
            // 网页端无法直接关闭窗口（除非是window.open打开的），这里用alert提示
            alert("感谢体验！你可以直接关闭此页面。");
        }

        // 返回首页
        function backToHome() {
            document.getElementById('result-overlay').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'block';
            clearInterval(timerInterval);
            clearInterval(tickInterval);
        }

        // 开始游戏
        function startGame() {
            initAudio(); // 用户点击后初始化音频
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('result-overlay').style.display = 'none';

            // 重置状态
            clearInterval(timerInterval);
            clearInterval(tickInterval);
            currentNumber = 1;
            timeLeft = 30.0;
            isPlaying = true;
            
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.innerText = `30.0s`;
            timerDisplay.classList.remove('timer-warning');
            document.getElementById('target-display').innerText = `找: 1`;

            // 生成1-30的随机数组
            let numbers = Array.from({length: 30}, (_, i) => i + 1);
            numbers.sort(() => Math.random() - 0.5);

            // 渲染网格
            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';
            numbers.forEach(num => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = num;
                cell.onclick = () => handleCellClick(cell, num);
                gridContainer.appendChild(cell);
            });

            // 倒计时逻辑 (每100毫秒更新一次)
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endGame(false);
                }
                // 格式化时间
                timerDisplay.innerText = `${timeLeft.toFixed(1)}s`;
                
                // 最后10秒变红闪烁
                if (timeLeft <= 10) {
                    timerDisplay.classList.add('timer-warning');
                }
            }, 100);

            // 音效逻辑 (每秒响一次)
            tickInterval = setInterval(() => {
                if (isPlaying) playTickSound();
            }, 1000);
        }

        // 处理点击格子
        function handleCellClick(cell, num) {
            if (!isPlaying) return;

            if (num === currentNumber) {
                cell.classList.add('clicked');
                currentNumber++;
                
                // 更新提示
                if (currentNumber <= 30) {
                    document.getElementById('target-display').innerText = `找: ${currentNumber}`;
                }

                // 如果点完了30个
                if (currentNumber > 30) {
                    endGame(true);
                }
            }
        }

        // 结束游戏
        function endGame(isSuccess) {
            isPlaying = false;
            clearInterval(timerInterval);
            clearInterval(tickInterval);
            
            const overlay = document.getElementById('result-overlay');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');

            overlay.style.display = 'flex';

            if (isSuccess) {
                const timeUsed = (30.0 - timeLeft).toFixed(1);
                title.innerText = "太棒了！挑战成功";
                title.style.color = "#6B8E78";
                desc.innerText = `你仅用时 ${timeUsed} 秒完成了30个数字！\n你的专注力超过了很多人。`;
            } else {
                title.innerText = "时间到！挑战失败";
                title.style.color = "#e74c3c";
                desc.innerText = `你找到了 ${currentNumber - 1} 个数字。\n没关系，放轻松，再试一次吧。`;
            }
        }
    </script>
</body>
</html>
