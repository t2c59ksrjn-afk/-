<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你是哪种灵魂饮品？</title>
    <style>
        /* 雾霾蓝 + 灰白 治愈系配色 */
        :root {
            --haze-blue: #7E9AAF; /* 雾霾蓝主色 */
            --light-bg: #F5F7F9; /* 灰白背景 */
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #334155;
            --text-sub: #64748B;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-bg);
            margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-main); user-select: none; -webkit-user-select: none; overflow: hidden;
        }

        .container {
            width: 90%; max-width: 380px; height: 90%; max-height: 650px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px; padding: 30px 24px;
            box-shadow: 0 10px 30px rgba(126, 154, 175, 0.08);
            text-align: center; box-sizing: border-box; 
            display: flex; flex-direction: column; position: relative;
        }
        
        /* 首页样式 */
        #start-screen { display: flex; flex-direction: column; height: 100%; justify-content: center; }
        h1 { font-size: 1.5rem; color: var(--haze-blue); margin-bottom: 12px; letter-spacing: 1px; font-weight: 800; }
        p.intro { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 40px; line-height: 1.6; }
        
        .btn {
            width: 100%; padding: 16px 0; font-size: 1.05rem; border: none; border-radius: 14px;
            cursor: pointer; transition: all 0.2s; font-weight: bold; letter-spacing: 1px;
            background-color: var(--haze-blue); color: white; 
        }
        .btn:active { background-color: #6A859B; transform: scale(0.98); }

        /* 答题区 */
        #quiz-screen { display: none; flex-direction: column; height: 100%; text-align: left; }
        .progress-bar { width: 100%; height: 4px; background: var(--border-color); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--haze-blue); width: 0%; transition: width 0.3s; }
        
        .question-text { font-size: 1.15rem; font-weight: bold; color: var(--text-main); margin-bottom: 24px; line-height: 1.5; min-height: 60px; }
        
        .option {
            background: var(--card-bg); padding: 16px; border-radius: 12px; margin-bottom: 12px;
            font-size: 0.95rem; color: var(--text-sub); cursor: pointer;
            border: 1px solid var(--border-color); transition: all 0.1s; line-height: 1.4;
        }
        .option:active { background: var(--light-bg); color: var(--haze-blue); border-color: var(--haze-blue); }

        /* 结果区 */
        #result-screen { display: none; flex-direction: column; height: 100%; align-items: center; overflow-y: auto; }
        #result-screen::-webkit-scrollbar { display: none; }
        
        .svg-container { width: 120px; height: 120px; margin-top: 5px; margin-bottom: 10px; }
        .svg-container svg { width: 100%; height: 100%; }

        .result-title { font-size: 1.5rem; font-weight: 800; color: var(--haze-blue); margin-bottom: 20px; letter-spacing: 1px; }
        
        .result-card {
            background: var(--light-bg); border-radius: 14px; padding: 18px; width: 100%; box-sizing: border-box;
            text-align: left; margin-bottom: 12px; border: 1px solid var(--border-color);
        }
        .result-card h3 { margin: 0 0 8px 0; font-size: 0.95rem; color: var(--haze-blue); display: flex; align-items: center;}
        .result-card p { margin: 0; font-size: 0.9rem; color: var(--text-sub); line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 首页 -->
        <div id="start-screen">
            <h1>你是哪种灵魂饮品？</h1>
            <p class="intro">测测你内心最真实的滋味。<br>（共 30 题，请凭直觉选择）</p>
            <button class="btn" onclick="startQuiz()">开始测试</button>
        </div>

        <!-- 答题页 -->
        <div id="quiz-screen">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <div class="question-text" id="question-text">问题</div>
            <div id="options-container"></div>
        </div>

        <!-- 结果页 -->
        <div id="result-screen">
            <div class="svg-container" id="res-svg"></div>
            <div class="result-title" id="res-title"></div>
            
            <div class="result-card">
                <h3>🧠 人格画像</h3>
                <p id="res-desc"></p>
            </div>
            <div class="result-card">
                <h3>✨ 灵魂建议</h3>
                <p id="res-advice"></p>
            </div>

            <button class="btn" style="margin-top: 10px; margin-bottom: 20px;" onclick="location.reload()">再测一次</button>
        </div>
    </div>

                </svg>`,
                desc: "直爽、接地气、三观极正。你就像一瓶国民级的冰红茶，有你在的地方就不会冷场。你热心肠，做事干脆利落，偶尔有点小脾气但绝不记仇，是可以两肋插刀的真性情。",
                advice: "你总是照顾大局，但也要学会拒绝。别把别人的责任扛在自己肩上，做个“自私”一点的人没关系的。"
            }
        };

        let currentQ = 0;
        let scores = { ice_americano: 0, oolong_tea: 0, grape_juice: 0, water: 0, hot_cocoa: 0, mint_soda: 0, ice_black_tea: 0 };

        function startQuiz() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'flex';
            currentQ = 0;
            renderQuestion();
        }

        function renderQuestion() {
            if (currentQ >= questions.length) {
                showResult();
                return;
            }
            const q = questions[currentQ];
            document.getElementById('progress-fill').style.width = `${((currentQ) / questions.length) * 100}%`;
            
            document.getElementById('question-text').innerText = q.q;
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            
            q.opts.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt.t;
                div.onclick = () => {
                    scores[opt.s] += 1;
                    currentQ++;
                    renderQuestion();
                };
                optsContainer.appendChild(div);
            });
        }

        function showResult() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';

            let maxDrink = '';
            let maxScore = -1;
            for (const [key, val] of Object.entries(scores)) {
                if (val > maxScore) {
                    maxScore = val;
                    maxDrink = key;
                }
            }

            const res = results[maxDrink];
            document.getElementById('res-svg').innerHTML = res.svg;
            document.getElementById('res-title').innerText = "你是一杯 " + res.name;
            document.getElementById('res-desc').innerText = res.desc;
            document.getElementById('res-advice').innerText = res.advice;
        }
    </script>
</body>
</html>
